name: Deploy API

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Scheduler.Api/Dockerfile
          push: true
          tags: renanmassini/agenda-api:latest

      - name: Atualizar API na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          envs: SMTP_PASSWORD,DATABASE_CONNECTION_STRING
          script: |
            test -n "$SMTP_PASSWORD" || { echo "Secret SMTP_PASSWORD não configurado."; exit 1; }
            test -n "$DATABASE_CONNECTION_STRING" || { echo "Secret DATABASE_CONNECTION_STRING não configurado."; exit 1; }
            export Email__Password="$SMTP_PASSWORD"
            export ConnectionStrings__DefaultConnection="$DATABASE_CONNECTION_STRING"
            docker pull renanmassini/agenda-api:latest
            docker rm -f agenda_api || true
            docker run -d \
              --name agenda_api \
              --restart always \
              --network agenda-inteligente_agenda_network \
              -p 5000:8080 \
              -e ASPNETCORE_URLS=http://+:8080 \
              -e Email__Password \
              -e ConnectionStrings__DefaultConnection \
              renanmassini/agenda-api:latest
